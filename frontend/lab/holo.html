<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <title>foldy lab - 홀로그램</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: manipulation; }
      body { font-family: system-ui, 'Malgun Gothic', sans-serif; color: #eee; }
      canvas { display: block; }
      #panel {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: min(320px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box;
        padding: 16px; border-radius: 12px; background: rgba(24, 24, 28, 0.94); font-size: 15px;
      }
      #panel.hidden { display: none; }
      #panel h1 { margin: 0 0 4px; font-size: 17px; }
      #panel p { margin: 0 0 12px; color: #aaa; font-size: 13px; line-height: 1.4; word-break: keep-all; }
      #panel label { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
      #panel input[type='range'] { flex: 1; }
      #panel select { flex: 1; font-size: 15px; padding: 4px; }
      #panel output { min-width: 3em; text-align: right; font-variant-numeric: tabular-nums; }
      #panel .buttons { display: flex; gap: 8px; margin-top: 14px; }
      #panel button { flex: 1; padding: 10px; border: 0; border-radius: 8px; font-size: 15px; background: #3d6fd9; color: #fff; }
      #panel button.plain { background: #333; }
    </style>
  </head>
  <body>
    <div id="panel">
      <h1>foldy 홀로그램 (실험)</h1>
      <p>휴대폰·태블릿을 눕히고 가운데 사각형 위에 아크릴 피라미드를 뒤집어 올려요. 화면을 누르면 이 설정이 열리고 닫혀요.</p>
      <label>도형 <select id="shape"></select></label>
      <label>가운데 크기 <input id="center" type="range" min="0.05" max="0.45" step="0.01" /> <output id="center-value"></output></label>
      <label>보는 높이 <input id="elevation" type="range" min="0" max="45" step="1" /> <output id="elevation-value"></output></label>
      <label><input id="mirror" type="checkbox" /> 좌우 반전 (거꾸로 보이면 켜기)</label>
      <label><input id="spin" type="checkbox" /> 천천히 돌기</label>
      <label><input id="fold" type="checkbox" /> 접었다 펴기 반복</label>
      <label><input id="guide" type="checkbox" /> 피라미드 놓을 자리 표시</label>
      <div class="buttons">
        <button id="fullscreen">전체 화면</button>
        <button id="close" class="plain">닫기</button>
      </div>
      <div class="buttons"><button id="reset" class="plain">설정 처음으로</button></div>
    </div>
    <script type="module" src="./holo.ts"></script>
  </body>
</html>
