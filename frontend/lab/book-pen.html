<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>책 위에 펜으로 그려 내기 (여러 전개도)</title>
    <link rel="stylesheet" href="/src/index.css" />
    <style>
      body { margin: 0; overflow: hidden; }
      #stage { position: fixed; inset: 0; }
      .bar { position: fixed; z-index: 1; left: 16px; top: 16px; display: grid; gap: 10px; padding: 14px 16px; border-radius: 24px; background: var(--slab); box-shadow: var(--panel-shadow); backdrop-filter: blur(18px); color: var(--muted); font-size: 14px; }
      .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .row b { width: 44px; color: var(--ink); }
      .bar button { min-width: 40px; }
      .bar button[aria-pressed='true'] { background: var(--accent-face); color: #fff; box-shadow: var(--accent-raised); }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div class="bar">
      <div class="row"><b>개수</b><span id="counts"></span></div>
      <div class="row"><b>놓기</b><span id="modes"></span></div>
      <div class="row"><button type="button" class="primary-button" id="again">다시 그리기</button><button type="button" class="secondary-button" id="slow">천천히 보기 (5배)</button></div>
    </div>
    <script type="module" src="./book-pen.ts"></script>
  </body>
</html>
